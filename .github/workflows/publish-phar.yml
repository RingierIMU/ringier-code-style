name: Publish the released PHAR

on:
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release version'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    name: Release PHAR

    permissions:
      # Required to upload the built PHAR as a release asset.
      contents: write

    env:
      # On `release` this is the tag; on `workflow_dispatch` github.ref_name is the
      # branch, so fall back to the tag typed into the dispatch input.
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Must match the `config.platform.php` pin in composer.json — composer
          # resolves against that pin regardless of the runtime, so a lower
          # runtime installs fine and then fatals at build time.
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2, phive
          coverage: none

      - name: Install the dependencies
        # laravel-zero/framework is a dev dependency and is required to build, so no --no-dev.
        # post-install-cmd runs phive, which populates the gitignored tools/ that box.json bundles.
        run: composer install --prefer-dist --no-progress

      - name: Create the PHAR file.
        run: ./ringier-code-style app:build ringier-code-style --build-version="$TAG"

      - name: Upload the PHAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ringier-code-style.phar
          path: builds/ringier-code-style

      - name: Upload the PHAR to release
        run: gh release upload "$TAG" builds/ringier-code-style --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
